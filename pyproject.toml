[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arduino-smart-bottle"
version = "0.1.0"
description = "Hydration sensor pipeline, modeling utilities, and CLI workflows for the Arduino Smart Bottle project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "polars>=1.33.0",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
smart-bottle-model = "model.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = true
